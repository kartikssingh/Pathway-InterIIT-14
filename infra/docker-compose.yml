# FraudGuard local infrastructure: Kafka, Postgres, Debezium, Redis.
#
# Changes from the original setup/docker-compose.yml:
#   * the obsolete top-level `version:` key is gone (Compose v2 warns on it);
#   * Postgres credentials come from the environment instead of being hard-coded
#     as user/password in the file;
#   * every service has a healthcheck, and dependants wait for `service_healthy`
#     rather than for the container merely existing — Debezium used to start
#     against a broker that was not yet accepting connections and needed a
#     manual restart;
#   * the Kafka cluster id is a variable rather than a literal that had to match
#     the one baked into the format command;
#   * migrations are mounted read-only into the Postgres init directory, so a
#     fresh volume is schema-complete without a separate script;
#   * Redis is available for the API's optional dashboard cache.
#
# Usage:  bash infra/bootstrap.sh        (first time)
#         docker compose -f infra/docker-compose.yml up -d

name: fraudguard

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- Kafka ----
  broker:
    <<: *restart
    image: confluentinc/cp-kafka:7.7.1
    container_name: broker
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://broker:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://broker:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4r4zNn9n4m3R4x8e8g1m6o890000}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    command:
      - /bin/sh
      - -c
      - |
        /usr/bin/kafka-storage format --ignore-formatted -t "$${CLUSTER_ID}" -c /etc/kafka/server.properties
        /etc/confluent/docker/run
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server broker:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ------------------------------------------------------------- Postgres ----
  postgres:
    <<: *restart
    image: postgres:16
    container_name: db_tuto_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-values_db}
    command:
      # Logical decoding is what Debezium needs to stream changes.
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=8
      - -c
      - max_replication_slots=8
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied in filename order the first time the volume is empty.
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-values_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------- Debezium ---
  debezium:
    <<: *restart
    image: quay.io/debezium/connect:2.7
    container_name: db_tuto_debezium
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      GROUP_ID: fraudguard-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ----------------------------------------------------------------- Redis ---
  # Optional: the API's dashboard cache. Harmless to leave running.
  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: fraudguard_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  kafka-data:
  postgres-data:
  redis-data:
