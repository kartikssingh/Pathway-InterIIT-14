[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard-api"
version = "2.0.0"
description = "Compliance and fraud-detection REST API"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live database and a running API",
    "load: performance test, run with locust",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "E501",   # handled by the formatter
    "B008",   # Depends()/Query() in defaults is the FastAPI idiom
]

[tool.ruff.format]
quote-style = "double"
