[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard-pipeline"
version = "2.0.0"
description = "Streaming KYC/AML compliance pipeline built on Pathway"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["fraudguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs Kafka/Postgres/network",
    "models: needs the trained artefacts in ml/models",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# ml/ holds the untouched training code and is excluded from lint churn.
exclude = ["ml", "out", "state"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"fraudguard/vision/*" = ["ALL"]   # vendored-style modules, kept close to the original

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["ml/", "fraudguard/vision/"]
